<div class="app-window" id="NotesApp">
  <div class="app-header">
    <span class="app-title">🗒️ Sticky Notes</span>
    <div class="app-controls"><button class="minimize-btn">–</button><button class="close-btn">×</button></div>
  </div>
  <div class="app-content">
    <div class="notes">
      <button id="nt-add">+ Add note</button>
      <div id="nt-board" class="nt-board"></div>
    </div>
  </div>
  <div class="resize-handle"></div>
</div>
